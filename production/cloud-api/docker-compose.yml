version: "3.9"

services:
  api:
    build: .
    container_name: nips-cloud-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:4100:4100"   # Nginx terminates TLS and proxies to this port
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /opt/nips-ai-dropshipping-cloud/storage/releases:/opt/nips-ai-dropshipping-cloud/storage/releases:ro

  db:
    image: postgres:16-alpine
    container_name: nips-cloud-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nips
      POSTGRES_PASSWORD: CHANGE_ME
      POSTGRES_DB: nips_cloud
    volumes:
      - nips_cloud_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nips -d nips_cloud"]
      interval: 5s
      retries: 10

volumes:
  nips_cloud_pgdata:

# Nginx server block for api.nipsdownloads.com
# Place in /etc/nginx/sites-available/api.nipsdownloads.com and symlink to sites-enabled/.
# Obtain TLS with: sudo certbot --nginx -d api.nipsdownloads.com

upstream nips_cloud_api {
    server 127.0.0.1:4100;
}

server {
    listen 80;
    server_name api.nipsdownloads.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.nipsdownloads.com;

    # Filled by certbot
    ssl_certificate     /etc/letsencrypt/live/api.nipsdownloads.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nipsdownloads.com/privkey.pem;

    client_max_body_size 4m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Increase timeouts for AI rewrite calls
    proxy_read_timeout  60s;
    proxy_send_timeout  60s;
    proxy_connect_timeout 10s;

    # Forward EVERYTHING to the Express app — both /api/* and /v1/*.
    location / {
        proxy_pass http://nips_cloud_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

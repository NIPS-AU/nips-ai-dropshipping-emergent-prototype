# Nginx server block for updates.nipsdownloads.com — plugin release downloads.

upstream nips_cloud_api {
    server 127.0.0.1:4100;
}

server {
    listen 80;
    server_name updates.nipsdownloads.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name updates.nipsdownloads.com;

    ssl_certificate     /etc/letsencrypt/live/updates.nipsdownloads.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/updates.nipsdownloads.com/privkey.pem;

    # Large download timeout
    proxy_read_timeout  300s;
    client_max_body_size 1m;

    location / {
        proxy_pass http://nips_cloud_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
